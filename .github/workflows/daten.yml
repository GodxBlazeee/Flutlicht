name: Spielerdaten aktualisieren

on:
  schedule:
    # Jede Nacht um 03:00 Uhr Wiener Zeit (01:00 UTC im Sommer)
    - cron: "0 1 * * *"
  workflow_dispatch:        # erlaubt Starten per Knopfdruck auf GitHub

permissions:
  contents: write

jobs:
  daten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Spieltag auswerten
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python hole_daten.py spieltag

      - name: Änderungen committen
        run: |
          git config user.name "Flutlicht Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daten: $(date +%F)"
          git push
